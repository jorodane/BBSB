name: Core checks
on:
  push:
    paths:
      - 'Assets/BBSB/Core/**'
      - 'Assets/BBSB/Runtime/**'
      - 'Assets/BBSB/Editor/**'
      - 'Assets/BBSB/Tests/PlayMode/**'
      - 'Assets/BBSB/Tests/EditMode/**'
      - 'Tools/CoreChecks/**'
      - '.github/workflows/core-checks.yml'
  pull_request:
    paths:
      - 'Assets/BBSB/Core/**'
      - 'Assets/BBSB/Runtime/**'
      - 'Assets/BBSB/Editor/**'
      - 'Assets/BBSB/Tests/PlayMode/**'
      - 'Assets/BBSB/Tests/EditMode/**'
      - 'Tools/CoreChecks/**'
      - '.github/workflows/core-checks.yml'
permissions:
  contents: read
jobs:
  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Assets/BBSB/Core
            Assets/BBSB/Runtime
            Assets/BBSB/Editor
            Assets/BBSB/Tests/PlayMode
            Assets/BBSB/Tests/EditMode
            Tools/CoreChecks
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run core regression checks
        run: dotnet run --project Tools/CoreChecks/BBSB.CoreChecks.csproj --configuration Release
